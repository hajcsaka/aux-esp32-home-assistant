<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#142b45"><text x="40" y="48" font-size="28" font-weight="bold">AUX → BSS138 → ESP32</text><text x="40" y="78" font-size="16">Documented installation • verify pin labels and voltage on each unit</text><text x="40" y="126" font-size="20" font-weight="bold">AUX indoor unit</text><text x="390" y="126" font-size="20" font-weight="bold">BSS138 level converter</text><text x="780" y="126" font-size="20" font-weight="bold">ESP32</text><rect x="25" y="155" width="1050" height="48" rx="8" fill="white"/><text x="40" y="185" font-size="18">AUX TX (yellow)</text><text x="390" y="185" font-size="18">HV1 ↔ LV1</text><text x="780" y="185" font-size="18">GPIO16 RX</text><rect x="25" y="214" width="1050" height="48" rx="8" fill="white"/><text x="40" y="244" font-size="18">AUX RX (white)</text><text x="390" y="244" font-size="18">HV2 ↔ LV2</text><text x="780" y="244" font-size="18">GPIO17 TX</text><rect x="25" y="273" width="1050" height="48" rx="8" fill="white"/><text x="40" y="303" font-size="18">AUX +5 V</text><text x="390" y="303" font-size="18">HV + separate VIN branch</text><text x="780" y="303" font-size="18">VIN (5 V)</text><rect x="25" y="332" width="1050" height="48" rx="8" fill="white"/><text x="40" y="362" font-size="18">Common GND</text><text x="390" y="362" font-size="18">GND / GND</text><text x="780" y="362" font-size="18">GND</text><rect x="25" y="391" width="1050" height="48" rx="8" fill="white"/><text x="40" y="421" font-size="18"></text><text x="390" y="421" font-size="18">LV ← 3.3 V</text><text x="780" y="421" font-size="18">3V3 → LV</text><text x="40" y="480" font-size="17" font-weight="bold">Do not join HV and LV supply rails. Never apply 12 V in this arrangement.</text><text x="40" y="510" font-size="16">Disconnect mains before wiring. No USB while powered by the AC. Read the full guide.</text></g></svg>