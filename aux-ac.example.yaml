# RECONSTRUCTED EXAMPLE — NOT A VERIFIED DEPLOYED CONFIGURATION
# Validate with your ESPHome version and hardware before flashing.
# Upstream master is mutable; record a tested revision for reproducible builds.
esphome:
  name: aux-ac-kitchen
  friendly_name: AUX AC Kitchen
esp32:
  variant: esp32
logger:
  baud_rate: 0
  level: DEBUG
api:
  encryption:
    key: !secret aux_kitchen_api_key
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "AUX Kitchen Fallback"
    password: !secret aux_fallback_password
captive_portal:
external_components:
  - source: github://GrKoR/esphome_aux_ac_component@master
    components: [aux_ac]
uart:
  id: aux_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
climate:
  - platform: aux_ac
    name: "AUX Air Conditioner Kitchen"
    uart_id: aux_uart
    period: 7s
    show_action: true
    display_inverted: false
    optimistic: false
    supported_modes:
      - HEAT_COOL
      - COOL
      - HEAT
      - DRY
      - FAN_ONLY
sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
binary_sensor:
  - platform: status
    name: "Connection Status"
